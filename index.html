<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orion Peptide Labs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0a0f1e;
    --navy-mid: #111827;
    --navy-light: #1a2540;
    --blue-accent: #3b82f6;
    --blue-bright: #60a5fa;
    --teal: #0ea5e9;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border: rgba(59,130,246,0.15);
    --border-bright: rgba(59,130,246,0.35);
    --card-bg: rgba(255,255,255,0.03);
    --card-hover: rgba(255,255,255,0.05);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--navy);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }

  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,15,30,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .logo-icon { width: 32px; height: 32px; }

  .logo-text {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-primary);
  }

  .logo-text span { color: var(--blue-accent); }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: color 0.2s;
    cursor: pointer;
  }

  .nav-links a:hover, .nav-links a.active { color: var(--text-primary); }

  .nav-cta {
    background: var(--blue-accent);
    color: white !important;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13px !important;
    font-weight: 600 !important;
    letter-spacing: 0.03em;
    transition: background 0.2s !important;
  }

  .nav-cta:hover { background: var(--blue-bright) !important; color: white !important; }

  .page { display: none; }
  .page.active { display: block; }

  .hero {
    position: relative;
    padding: 100px 2rem 80px;
    text-align: center;
    overflow: hidden;
  }

  .hero-grid {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(59,130,246,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .hero-glow {
    position: absolute;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(59,130,246,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(59,130,246,0.1);
    border: 1px solid rgba(59,130,246,0.25);
    color: var(--blue-bright);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 24px;
  }

  .hero h1 {
    font-size: clamp(36px, 5vw, 60px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    position: relative;
  }

  .hero h1 em { font-style: normal; color: var(--blue-accent); }

  .hero-sub {
    font-size: 18px;
    color: var(--text-secondary);
    max-width: 560px;
    margin: 0 auto 40px;
    line-height: 1.7;
    position: relative;
  }

  .hero-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
  }

  .btn-primary {
    background: var(--blue-accent);
    color: white;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.01em;
  }

  .btn-primary:hover { background: var(--blue-bright); transform: translateY(-1px); }

  .btn-secondary {
    background: transparent;
    color: var(--text-secondary);
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    border: 1px solid var(--border-bright);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-secondary:hover { color: var(--text-primary); border-color: var(--blue-accent); background: rgba(59,130,246,0.05); }

  .trust-bar {
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 20px 2rem;
    display: flex;
    justify-content: center;
    gap: 3rem;
    flex-wrap: wrap;
    background: rgba(255,255,255,0.01);
  }

  .trust-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.01em;
  }

  .trust-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue-accent); flex-shrink: 0; }

  .section { padding: 72px 2rem; max-width: 1100px; margin: 0 auto; }

  .section-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--blue-accent);
    margin-bottom: 10px;
  }

  .section-title {
    font-size: clamp(24px, 3vw, 36px);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
  }

  .section-sub {
    font-size: 16px;
    color: var(--text-secondary);
    max-width: 520px;
    margin-bottom: 48px;
    line-height: 1.7;
  }

  .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

  .product-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }

  .product-card:hover { background: var(--card-hover); border-color: var(--border-bright); transform: translateY(-2px); }

  .product-name { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
  .product-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.65; margin-bottom: 20px; }

  footer {
    border-top: 1px solid var(--border);
    padding: 32px 2rem;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
  }
</style>
</head>

<body>

<nav>
  <div class="logo" onclick="location.reload()">
    <span class="logo-text">Orion <span>Peptide Labs</span></span>
  </div>
</nav>

<div class="hero">
  <h1>Precision peptides.<br><em>Verified purity.</em></h1>
  <p class="hero-sub">Orion Peptide Labs supplies research-grade compounds with verified purity standards.</p>
</div>

<footer>
© 2026 Orion Peptide Labs
</footer>

</body>
</html>
